<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopNova | Products</title>

    <link rel="stylesheet" href="product.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        Shop<span>Nova</span>
    </div>

    <nav>

        <a href="index.html">Home</a>

        <a href="product.html" class="active">
            Products
        </a>

        <a href="about.html">
            About
        </a>

        <a href="cart.html">
            Cart <span id="cartCount">0</span>
        </a>

    </nav>

</header>


<main>

<section class="products-header">

    <p>SHOPNOVA STORE</p>

    <h1>Explore our products</h1>

    <p>
        Discover products selected for modern everyday life.
    </p>

</section>


<section class="products-section">

    <div class="controls">

        <input
            type="search"
            id="searchInput"
            placeholder="Search products..."
        >

        <select id="categoryFilter">

            <option value="All">
                All Categories
            </option>

            <option value="Electronics">
                Electronics
            </option>

            <option value="Fashion">
                Fashion
            </option>

            <option value="Home">
                Home
            </option>

            <option value="Accessories">
                Accessories
            </option>

        </select>

        <select id="sortFilter">

            <option value="default">
                Sort: Featured
            </option>

            <option value="low">
                Price: Low to High
            </option>

            <option value="high">
                Price: High to Low
            </option>

            <option value="rating">
                Highest Rated
            </option>

        </select>

    </div>


    <div id="productGrid" class="product-grid"></div>

    <div id="emptyMessage" class="empty">
        No products found.
    </div>

</section>

</main>


<div id="toast" class="toast">
    Product added to cart!
</div>


<footer>

    <div class="logo">
        Shop<span>Nova</span>
    </div>

    <p>
        DevOps powered shopping experience.
    </p>

    <div class="copyright">
        © <span id="year"></span> ShopNova
    </div>

</footer>


<script src="product.js"></script>

</body>
</html>
